name: day12-agent

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  agent:
    image: ${DAY12_IMAGE:?Set DAY12_IMAGE to an immutable Docker Hub tag}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: production
      DEBUG: "false"
      OPENAI_API_KEY: ""
      AGENT_API_KEY: ${AGENT_API_KEY:?Set AGENT_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      RATE_LIMIT_PER_MINUTE: "10"
      DAILY_BUDGET_USD: "5.0"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: https://day12.huygoodboy.io.vn
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  redis_data:
