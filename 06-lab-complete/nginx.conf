# ============================================================
# Nginx reverse proxy + load balancer
# Used for Part 5.4 — horizontally scaled agent instances
# ============================================================

upstream agent_backend {
    # 3 agent instances (started by docker compose --scale agent=3)
    least_conn;  # route to instance with fewest active connections
    server agent:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers (defense in depth, even at edge)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # Larger body limit (questions can be long)
    client_max_body_size 1m;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Health check passthrough
    location = /health {
        proxy_pass http://agent_backend/health;
        proxy_set_header Host $host;
        access_log off;  # don't spam logs with health pings
    }

    location = /ready {
        proxy_pass http://agent_backend/ready;
        proxy_set_header Host $host;
    }

    # Metrics
    location = /metrics {
        proxy_pass http://agent_backend/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # JWT demo
    location = /token {
        proxy_pass http://agent_backend/token;
        proxy_set_header Host $host;
    }

    location = /secure {
        proxy_pass http://agent_backend/secure;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Main agent endpoint
    location = /ask {
        proxy_pass http://agent_backend/ask;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Root → service info
    location = / {
        proxy_pass http://agent_backend/;
        proxy_set_header Host $host;
    }

    # Docs (dev only — disable in prod by env)
    location /docs {
        proxy_pass http://agent_backend/docs;
        proxy_set_header Host $host;
    }
}
